name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: go build ./cmd/...

  appliance:
    name: Appliance bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate server script syntax
        run: |
          bash -n scripts/install-server.sh
          bash -n scripts/uninstall-server.sh
          sh -n deploy/certbot/deploy-hook.sh
      - name: Validate Compose configuration
        env:
          MAIL_HOSTNAME: mail.example.com
        run: docker compose config --quiet
      - name: Build the application image
        run: docker build --tag meovv-mail:ci .
